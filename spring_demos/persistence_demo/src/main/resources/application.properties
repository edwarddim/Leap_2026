spring.application.name=persistence-demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/persistence_demo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:rootroot}

# Runs schema.sql on startup (it uses CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.persistencedemo.model
mybatis.configuration.map-underscore-to-camel-case=true

# Base64-encoded HmacSHA256 key (>= 32 bytes). The default is for local dev only;
# set JWT_SECRET in any real environment (e.g. openssl rand -base64 32).
jwt.secret=${JWT_SECRET:NDBqDN41FmSxWBjdjIYxNd9DRTSHdp9HoECWt9th2tc=}
jwt.expiration=PT1H

# Logs the SQL MyBatis executes
logging.level.com.example.persistencedemo.mapper=debug
